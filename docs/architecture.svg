<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="1520" height="1000" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A94A6"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#FFFFFF"/>

  <text x="24" y="32" font-size="15" font-weight="600" fill="#0F1B33">eProcure architecture: one web app serves every organisation; one database stores everything</text>

  <!-- Users -->
  <rect x="60" y="56" width="280" height="56" rx="8" fill="none" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="76" y="80" font-weight="600" fill="#0F1B33">Suppliers</text>
  <text x="76" y="100" font-size="11.5" fill="#5B6577">Browser or phone: register, apply, track</text>

  <rect x="420" y="56" width="280" height="56" rx="8" fill="none" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="436" y="80" font-weight="600" fill="#0F1B33">Organisation staff</text>
  <text x="436" y="100" font-size="11.5" fill="#5B6577">Branded console: tenders, bids, evaluation, awards</text>

  <g fill="none" stroke="#8A94A6" stroke-width="1.25">
    <path d="M200 112V144" marker-end="url(#arrow)"/>
    <path d="M560 112V144" marker-end="url(#arrow)"/>
    <path d="M148 332V384" marker-end="url(#arrow)"/>
    <path d="M380 332V384" marker-end="url(#arrow)"/>
    <path d="M612 332V384" marker-end="url(#arrow)"/>
  </g>

  <!-- Web app -->
  <rect x="24" y="144" width="712" height="188" rx="8" fill="#F3F6FA" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="40" y="170" font-weight="600" fill="#0F1B33">eProcure web app · ASP.NET Core MVC on .NET 8</text>

  <rect x="40" y="188" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="56" y="212" font-weight="600" fill="#0F1B33">Supplier area</text>
  <text x="56" y="232" font-size="11.5" fill="#5B6577">feed, application, track record</text>

  <rect x="272" y="188" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="288" y="212" font-weight="600" fill="#0F1B33">Admin area</text>
  <text x="288" y="232" font-size="11.5" fill="#5B6577">tenders, bids, BEC and BAC</text>

  <rect x="504" y="188" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="520" y="212" font-weight="600" fill="#0F1B33">Accounts (Identity)</text>
  <text x="520" y="232" font-size="11.5" fill="#5B6577">sign-in, roles, password reset</text>

  <rect x="40" y="260" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="56" y="284" font-weight="600" fill="#0F1B33">Business rules</text>
  <text x="56" y="304" font-size="11.5" fill="#5B6577">eligibility, functionality, PPPFA, sealing</text>

  <rect x="272" y="260" width="216" height="56" rx="8" fill="#E3F1FB" stroke="#1CA3EC" stroke-width="2"/>
  <text x="288" y="284" font-weight="600" fill="#0F1B33">Tenant filter</text>
  <text x="288" y="304" font-size="11.5" fill="#0F1B33">one organisation per query</text>

  <rect x="504" y="260" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="520" y="284" font-weight="600" fill="#0F1B33">Scheduled job</text>
  <text x="520" y="304" font-size="11.5" fill="#5B6577">reminders, closing notices</text>

  <!-- Storage -->
  <rect x="40" y="384" width="216" height="56" rx="8" fill="none" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="56" y="408" font-weight="600" fill="#0F1B33">SQL Server: EProcure</text>
  <text x="56" y="428" font-size="11.5" fill="#5B6577">16 tables, audit log</text>

  <rect x="272" y="384" width="216" height="56" rx="8" fill="none" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="288" y="408" font-weight="600" fill="#0F1B33">File storage</text>
  <text x="288" y="428" font-size="11.5" fill="#5B6577">PDFs on disk; Azure Blob next</text>

  <rect x="504" y="384" width="216" height="56" rx="8" fill="none" stroke="#8A94A6" stroke-width="1.25"/>
  <text x="520" y="408" font-weight="600" fill="#0F1B33">External services</text>
  <text x="520" y="428" font-size="11.5" fill="#5B6577">email, SMS, payments (mocks)</text>

  <text x="24" y="476" font-size="11" fill="#5B6577">Runs locally today (SQL Server LocalDB). Mocked services sit behind interfaces, so real providers replace them without other changes.</text>
</svg>
